# ============================================================
# GitHub Actions - Compile NOVIA HOME (ESPHome)
# File ini TARUH di: .github/workflows/main.yml
# File novia-home.yml TARUH di: folder paling luar (root)
# ============================================================
# CARA KERJA:
# Setiap kamu push ke GitHub, file ini akan otomatis
# compile novia-home.yml jadi firmware .bin
# ============================================================

name: Compile Novia Home

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Compile ESPHome
        uses: esphome/build-action@v1
        with:
          yaml_file: novia-home.yml
          version: latest
          release_summary: "Novia Home V4.0 - Build Otomatis"
          release: true
          
